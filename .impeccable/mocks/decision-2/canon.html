<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fffaf3;font-family:Onest,sans-serif;color:#2b211b}
.hero{height:170px;background:radial-gradient(circle at 60% 60%,#e9b45a 0 25%,#c2562b 26% 40%,#8a5a32 41%)}
header{padding:12px 16px;display:flex;justify-content:space-between}
.name{font-weight:700;font-size:22px}
.tabs{display:flex;gap:18px;padding:4px 16px 10px;font-weight:600;color:#8a7a6e}
.tabs .on{color:#e4572e}
.card{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f0e6da}
.img{width:84px;height:84px;border-radius:12px;background:radial-gradient(circle,#e9b45a 0 40%,#c2562b 41% 60%,#d9a441 61%);flex:none}
.card h3{font-size:16px}
.card p{font-size:13px;color:#8a7a6e;margin:3px 0 8px}
.cart{position:absolute;left:16px;right:16px;bottom:18px;background:#e4572e;color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;font-weight:700}
</style></head><body>
<div class="hero"></div>
<header><span class="name">Pizzeria</span><span>ქა · EN · RU</span></header>
<nav class="tabs"><span class="on">Pizzas</span><span>Drinks</span><span>Info</span></nav>
<div class="card"><div class="img"></div><div><h3>Margherita</h3><p>Tomato, mozzarella, basil</p><b>15 ₾</b></div></div>
<div class="card"><div class="img"></div><div><h3>Pepperoni</h3><p>Tomato, mozzarella, pepperoni</p><b>18 ₾</b></div></div>
<div class="card"><div class="img"></div><div><h3>Sulguni &amp; mushroom</h3><p>Sulguni, champignons</p><b>19 ₾</b></div></div>
<div class="cart"><span>View order · 3</span><span>49 ₾</span></div>
</body></html>
