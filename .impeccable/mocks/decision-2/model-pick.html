<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#f7efe3;color:#2a1d17;font-family:Onest,sans-serif}
header{background:#c2562b;color:#f7efe3;padding:16px 16px 40px;border-radius:0 0 50% 50%/0 0 36px 36px}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-family:"Yeseva One";font-size:30px}
.lang{font-size:13px;font-weight:600}
.status{font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(42,29,23,.12)}
.ph{height:110px;background:radial-gradient(circle,#e9b45a 0 35%,#c2562b 36% 55%,#d9a441 56%)}
.c{padding:10px}
.c h3{font-family:"Yeseva One";font-size:17px;font-weight:400}
.c p{font-size:12px;color:#6b5546}
.f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:800}
.f span:last-child{background:#2a1d17;color:#f7efe3;border-radius:999px;width:30px;height:30px;display:grid;place-items:center}
.kraft{position:absolute;left:12px;right:12px;bottom:14px;background:#c9a77a;border-radius:6px;padding:12px 14px;color:#2a1d17}
.kraft p{font-size:14px;font-weight:600}
.wa{margin-top:10px;background:#2f7d4f;color:#fff;border-radius:10px;padding:14px;font-weight:800;display:flex;justify-content:space-between}
</style></head><body>
<header><div class="top"><span class="name">Pizzeria</span><span class="lang">ქა · EN · RU</span></div><p class="status">Open · ready in ~20 min</p></header>
<section class="grid">
 <div class="card"><div class="ph"></div><div class="c"><h3>Margherita</h3><p>Tomato, mozzarella</p><div class="f"><span>15 ₾</span><span>2</span></div></div></div>
 <div class="card"><div class="ph"></div><div class="c"><h3>Pepperoni</h3><p>Pepperoni, mozzarella</p><div class="f"><span>18 ₾</span><span>+</span></div></div></div>
 <div class="card"><div class="ph"></div><div class="c"><h3>Sulguni</h3><p>Sulguni, mushroom</p><div class="f"><span>19 ₾</span><span>1</span></div></div></div>
 <div class="card"><div class="ph"></div><div class="c"><h3>Imeruli</h3><p>Imeruli cheese</p><div class="f"><span>20 ₾</span><span>+</span></div></div></div>
</section>
<div class="kraft"><p>2 Margherita · 1 Sulguni · pickup ASAP</p><div class="wa"><span>Send on WhatsApp</span><span>49 ₾</span></div></div>
</body></html>
