<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700&family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:Onest,"Noto Sans Georgian",sans-serif;color:#111827}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.name{font-weight:700;font-size:20px}
.lang{font-size:13px;color:#6b7280}
.tabs{display:flex;gap:18px;padding:12px 16px;font-size:14px;font-weight:600;color:#6b7280}
.tabs .on{color:#e4572e;border-bottom:2px solid #e4572e;padding-bottom:6px}
.card{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f1f1f1}
.img{width:88px;height:88px;border-radius:12px;background:#f3e3d8;flex:none;display:grid;place-items:center;font-size:10px;color:#a0705a}
.card h3{font-size:16px;font-weight:700}
.card p{font-size:13px;color:#6b7280;margin:3px 0 8px}
.foot{display:flex;justify-content:space-between;align-items:center}
.foot b{font-size:15px}
.btn{background:#111827;color:#fff;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;font-weight:700}
.cart{position:absolute;left:16px;right:16px;bottom:18px;background:#e4572e;color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;font-weight:700;font-size:16px}
</style></head><body>
<header><span class="name">Pizzeria</span><span class="lang">ქა · EN · RU</span></header>
<nav class="tabs"><span class="on">Pizzas</span><span>Drinks</span><span>Info</span></nav>
<div class="card"><div class="img">photo</div><div style="flex:1"><h3>Margherita</h3><p>Tomato, mozzarella, basil</p><div class="foot"><b>₾ 15</b><span class="btn">+</span></div></div></div>
<div class="card"><div class="img">photo</div><div style="flex:1"><h3>Pepperoni</h3><p>Tomato, mozzarella, pepperoni</p><div class="foot"><b>₾ 18</b><span class="btn">+</span></div></div></div>
<div class="card"><div class="img">photo</div><div style="flex:1"><h3>Sulguni &amp; mushroom</h3><p>Sulguni, champignons</p><div class="foot"><b>₾ 19</b><span class="btn">+</span></div></div></div>
<div class="card"><div class="img">photo</div><div style="flex:1"><h3>Four cheese</h3><p>Four cheeses</p><div class="foot"><b>₾ 21</b><span class="btn">+</span></div></div></div>
<div class="cart"><span>View order · 3</span><span>₾ 49</span></div>
</body></html>
